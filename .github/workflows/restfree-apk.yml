name: Build RestFree APK

on:
  push:
    branches:
      - restfree-apk-build
  workflow_dispatch:

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: restfree-apk-build

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle -p restfree-android assembleDebug --stacktrace

      - name: Copy APK
        run: |
          mkdir -p restfree-android/dist
          cp restfree-android/app/build/outputs/apk/debug/app-debug.apk restfree-android/dist/RestFree.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: RestFree-6min-APK
          path: restfree-android/dist/RestFree.apk
          if-no-files-found: error

      - name: Commit APK to build branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f restfree-android/dist/RestFree.apk
          git commit -m "build: refresh RestFree APK" || exit 0
          git push origin restfree-apk-build
