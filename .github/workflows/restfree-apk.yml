name: Build RestFree APK

on:
  push:
    branches:
      - restfree-apk-build
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle -p restfree-android assembleDebug --stacktrace

      - name: Collect APK
        run: |
          mkdir -p apk-output
          cp restfree-android/app/build/outputs/apk/debug/app-debug.apk apk-output/RestFree.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: RestFree-APK
          path: apk-output/RestFree.apk
          if-no-files-found: error
